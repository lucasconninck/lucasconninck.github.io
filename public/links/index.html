<style>
:root{
  color-scheme:dark;
  --fundo:#091411; --sup:#10201A; --sup2:#162A22;
  --linha:rgba(245,243,237,.12); --linha2:rgba(245,243,237,.24);
  --texto:#F5F3ED; --texto2:rgba(245,243,237,.74); --texto3:rgba(245,243,237,.6);
  --salvia:#9CC4A3; --verde:#2FD47A; --verde2:#4BE38E;
}
*{box-sizing:border-box;margin:0}
html,body{overscroll-behavior-y:none}
body{font-family:Archivo,system-ui,sans-serif;background:var(--fundo);color:var(--texto);min-height:100dvh;-webkit-font-smoothing:antialiased;line-height:1.45;display:flex;justify-content:center}
body::before{content:'';position:fixed;inset:0 0 auto;height:420px;z-index:-1;pointer-events:none;background:radial-gradient(70% 100% at 50% 0%,rgba(115,158,122,.16),transparent 70%)}
main{width:100%;max-width:460px;padding:44px 16px 32px;display:flex;flex-direction:column;min-height:100dvh}
.marca{font-weight:800;font-size:22px;letter-spacing:-.02em;font-stretch:110%;text-align:center}
.marca span{color:var(--salvia)}
.sub{text-align:center;color:var(--texto2);font-size:16px;margin:8px 0 30px}
.opcoes{display:flex;flex-direction:column;gap:12px}
a.op{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--texto);background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:16px;transition:border-color .16s ease,background .16s ease}
a.op:hover{border-color:var(--linha2);background:var(--sup2)}
a.op:active{transform:scale(.99)}
a.op:focus-visible{outline:3px solid var(--verde);outline-offset:2px}
.ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:rgba(115,158,122,.16);color:var(--salvia)}
.ico svg{width:24px;height:24px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;font-weight:750;color:#fff;letter-spacing:-.01em}
.txt small{display:block;font-size:14px;color:var(--texto3);margin-top:2px}
.seta{flex:none;color:var(--texto3);font-size:22px;line-height:1}
.op.principal{background:var(--verde);border-color:var(--verde);color:var(--fundo)}
.op.principal:hover{background:var(--verde2);border-color:var(--verde2)}
.op.principal .ico{background:rgba(9,20,17,.14);color:var(--fundo)}
.op.principal .txt b{color:var(--fundo)}
.op.principal .txt small,.op.principal .seta{color:rgba(9,20,17,.72)}
.rodape{margin-top:auto;padding-top:36px;text-align:center;font-size:13px;color:var(--texto3)}
.rodape a{color:var(--texto2)}
</style>
</head>
<body>
<main>

  <p class="sub">Vídeos e sites para o seu negócio.<br>Você vê pronto antes de pagar.</p>

  <div class="opcoes">

      <span class="txt"><b>Vídeo animado com narração</b><small>Prévia grátis · R$ 29,90 por vídeo</small></span>
      <span class="seta" aria-hidden="true">›</span>
    </a>
    <a class="op" href="https://lucaslimaweb.com.br/quiz/?utm_source=instagram&amp;utm_medium=bio&amp;utm_campaign=links">
      <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2.5"/><path d="M2 9h20M6 6.5h.01M9 6.5h.01"/></svg></span>
      <span class="txt"><b>Site para o seu negócio</b><small>Demonstração grátis · a partir de R$ 490</small></span>
      <span class="seta" aria-hidden="true">›</span>
    </a>
  </div>

  <p class="rodape">Dúvidas? Fale no Instagram <a href="https://www.instagram.com/thrustspike/">@thrustspike</a></p>
</main>
</body>
</html>
